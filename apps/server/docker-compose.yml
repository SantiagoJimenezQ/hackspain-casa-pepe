services:
  postgres:
    image: postgres:16-alpine
    container_name: casa-pepe-postgres
    environment:
      POSTGRES_DB: casa_pepe
      POSTGRES_USER: casa_pepe
      POSTGRES_PASSWORD: casa_pepe
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - casa-pepe-postgres-data:/var/lib/postgresql/data

volumes:
  casa-pepe-postgres-data:
